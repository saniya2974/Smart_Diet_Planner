<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="dark-mode-toggle" onclick="toggleDarkMode()">Toggle Dark Mode</button>
  <div class="logo">Recipe Finder</div>
  <div class="search-container">
    <input type="text" id="ingredient" placeholder="Enter a dish name" onkeyup="showSuggestions(event)" onkeypress="if(event.key === 'Enter') suggestRecipes()">
    <div id="suggestions"></div>
    <div class="buttons">
      <button onclick="suggestRecipes()">Find Recipes</button>
    </div>
    <img id="recipeImage" class="recipe-image" style="display: none;" />
    <p id="recipeResult"></p>
    <p id="recipeSteps"></p>
    <button id="home"> Back to 🏠 Home </button>
  </div>
  <script src="../JS/meal_planner.js"></script>
</body>
</html>
