<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserGoal</title>
    <link rel="stylesheet" href="../CSS/goal.css" />

</head>
<body>
    <div class="heading">
        <h2>Are there any foods you prefer to avoid ? &#10060;</h2>
        <p>Any food allergies, or something. </p>


        <div class="btn-group">
            <h2>Common Exclusions </h2>
            <input type="checkbox" id="glu" name="exc" value="glut">
            <label for="glu">Gluten</label>

            <input type="checkbox" id="pea" name="exc" value="pea">
            <label for="pea">Peanuts</label>
    
            <input type="checkbox" id="fish" name="exc" value="fish">
            <label for="fish">Fish</label>

            <input type="checkbox" id="dairy" name="exc" value="dairy">
            <label for="dairy">Dairy</label>

            <input type="checkbox" id="soy" name="exc" value="soy">
            <label for="soy">Soy</label>
        </div>

        <div class="other">
           <h3> Other Exclusions > </h3>
           <div id="exclusion-list"></div> <!--dynamic exclusions list-->
        </div>
    </div>

        <div class="goal">
            <h2>What is your goal? &#127919;</h2>
            <p>It will help us recommend the perfect meals tailored to your goals! 🍽️✨ </p>
            
            <div class="sel1">
            <p>Select a goal: </p>
            <input type="radio" id="gen" name="goal" value="gen">
            <label for="gen">General</label>

            <input type="radio" id="exact" name="goal" value="exact">
            <label for="exact">Exact Goal</label>
            </div>

            <div class="sel2">
                <p>I want to: </p>
                <input type="radio" id="loose" name="g" value="loose">
                <label for="loose">Lose Fat</label>
    
                <input type="radio" id="gain" name="g" value="gain">
                <label for="gain">Gain Weight</label>
                
                <input type="radio" id="build" name="g" value="build">
                <label for="build">Build Muscle</label>
                </div>
                
                
        <button type="submit" id="next"> > Submit </a></button>

        </div>


    
    <script>
        let excl = document.querySelector(".other");
        let exclusionList = document.createElement("p"); // Create a separate element for displaying exclusions
        excl.appendChild(exclusionList); // Append it inside "Other Exclusions"
        let exclusions = [];
        
        excl.addEventListener("click", function () {
            if (document.querySelector(".exclusion-input")) return; // Prevent duplicate input fields
        
            let inp = document.createElement("input");
            inp.type = "text";
            inp.placeholder = "Enter exclusion e.g. Egg";
            inp.classList.add("exclusion-input");
            inp.style.margin = "10px";
            inp.style.width = "200px";
            inp.style.backgroundColor = "black";
            inp.style.border = "2px solid transparent";
            inp.style.color = "white";
        
            let addBtn = document.createElement("button");
            addBtn.textContent = "➕";
            addBtn.style.marginLeft = "10px";
            addBtn.style.padding = "5px";
            addBtn.style.border = "1px solid white";
            addBtn.style.backgroundColor = "#2a9d8f";
            addBtn.style.color = "white";
            addBtn.style.cursor = "pointer";
        
            let resetBtn = document.createElement("button");
            resetBtn.textContent = "Reset";
            resetBtn.style.marginLeft = "10px";
            resetBtn.style.padding = "5px";
            resetBtn.style.border = "1px solid white";
            resetBtn.style.backgroundColor = "#be6308";
            resetBtn.style.color = "white";
            resetBtn.style.cursor = "pointer";
        
            excl.appendChild(inp);
            excl.appendChild(addBtn);
            excl.appendChild(resetBtn);
        
            inp.focus();
        
            addBtn.addEventListener("click", function () {
                let enteredText = inp.value.trim();
                if (enteredText !== "" && !exclusions.includes(enteredText)) {
                    exclusions.push(enteredText);
                    inp.value = "";
                    updateExclusionList();
                }
            });
        
            resetBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                exclusions = []; // Clear stored exclusions
                updateExclusionList();
                inp.value = "";
            });
        });
        
        function updateExclusionList() {
            exclusionList.innerHTML =
                exclusions.length > 0 ? `<strong></strong> ${exclusions.join(", ")}` : "";
        }
        

        document.querySelector("#next").addEventListener("click", function (event) {
            event.preventDefault();

            let goal = document.querySelector('input[name="goal"]:checked')?.value || "General";
            let target = document.querySelector('input[name="g"]:checked')?.value || "";
            let commonExclusions = Array.from(document.querySelectorAll('input[name="exc"]:checked')).map(e => e.value);

            let formData = {
                goal: goal,
                target: target,
                commonExclusions: commonExclusions,
                otherExclusions: exclusions
            };

            localStorage.setItem('userGoal',JSON.stringify(formData));
            //window.location.href="../HTML/dash.html";

            
             // Send data to backend for AI processing
             fetch("http://127.0.0.1:5000/generate-diet", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData),
            })
            .then(response => response.json())
            .then(data => {
                console.log("🔹 API Response Received:", data);
                if (data.dietPlan) {
                    localStorage.setItem("dietPlan", JSON.stringify(data.dietPlan));
                    setTimeout(() => {
                        window.location.href = "../HTML/dash.html"; // Redirect only after saving
                    }, 500);
                } else {
                    console.error("❌ Error: No diet plan received from API.");
                }
            })
    .catch(error => console.error("Error:", error));
            
        });



    </script>
</body>
</html>
